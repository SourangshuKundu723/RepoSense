services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reposense-postgres
    environment:
      POSTGRES_DB: reposense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - reposense_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reposense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  reposense_pg_data: